<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ring Ceremony | Ankit & Vratika</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Georgia, serif;
  min-height:100vh;
  background:
    linear-gradient(
      rgba(20,10,10,0.75),
      rgba(60,30,30,0.85)
    ),
    url("https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  background-position:center;
  color:#fff;
}

.wrapper{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  font-size:46px;
  margin-bottom:10px;
}

.date{
  font-size:20px;
  margin-bottom:6px;
}

.venue{
  font-size:18px;
  margin-bottom:25px;
}

.buttons{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:25px;
}

.btn{
  padding:14px 30px;
  border-radius:30px;
  background:linear-gradient(135deg,#d4af37,#f5d76e);
  color:#000;
  text-decoration:none;
  font-size:18px;
}

.btn.outline{
  background:transparent;
  border:2px solid #d4af37;
  color:#d4af37;
}

.countdown{
  display:flex;
  gap:16px;
  justify-content:center;
}

.countdown div{
  background:rgba(0,0,0,0.5);
  padding:12px 16px;
  border-radius:12px;
}

.countdown span{
  font-size:22px;
  display:block;
}

@media(max-width:600px){
  h1{font-size:30px;}
  .date,.venue{font-size:16px;}
}
</style>
</head>

<body>

<div class="wrapper">

  <h1>Ring Ceremony 💍</h1>

  <div class="date"><strong>4 February 2026</strong></div>
  <div class="date">10:00 AM – 4:00 PM</div>

  <div class="venue">
    📍 Hotel Bravura Gold Resort, Meerut
  </div>

  <div class="buttons">
    <a class="btn" target="_blank"
       href="https://maps.app.goo.gl/ov7T9VT1w4aH7rnC8?g_st=ac">
       📍 Open Location
    </a>

    <a class="btn outline" href="wedding.html">
      Next → Wedding Night 💒
    </a>
  </div>

  <div class="countdown">
    <div><span id="days">00</span>Days</div>
    <div><span id="hours">00</span>Hours</div>
    <div><span id="minutes">00</span>Minutes</div>
  </div>

</div>

<script>
const eventTime = new Date("2026-02-04T10:00:00+05:30").getTime();
setInterval(()=>{
  const now = new Date().getTime();
  const d = eventTime - now;

  if(d < 0) return;

  document.getElementById("days").innerText =
    Math.floor(d/(1000*60*60*24));
  document.getElementById("hours").innerText =
    Math.floor((d%(1000*60*60*24))/(1000*60*60));
  document.getElementById("minutes").innerText =
    Math.floor((d%(1000*60*60))/(1000*60));
},1000);
</script>

</body>
</html>
