<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ring Ceremony</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
  text-align:center;font-family:Arial;color:white;
  background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),
    url("assets/ring.jpg") center/cover no-repeat;
}
.box{background:rgba(0,0,0,.5);padding:30px;border-radius:20px;width:90%;max-width:500px;}
a{display:inline-block;margin-top:15px;padding:12px 24px;background:gold;color:black;text-decoration:none;border-radius:25px;font-weight:bold;}
.timer{display:flex;gap:15px;justify-content:center;margin-top:20px;}
.timer div{background:black;padding:10px;border-radius:10px;}
</style>
</head>
<body>
<div class="box">
<h1>Ring Ceremony 💍</h1>
<p>4 February 2026 | 10:00 AM – 4:00 PM</p>
<p>Hotel Bravura Gold Resort, Meerut</p>
<a target="_blank" href="https://maps.app.goo.gl/ov7T9VT1w4aH7rnC8?g_st=ac">📍 Open Location</a>
<div class="timer">
<div><span id="d"></span>Days</div>
<div><span id="h"></span>Hours</div>
<div><span id="m"></span>Min</div>
</div>
</div>
<script>
const t=new Date("2026-02-04T10:00:00+05:30").getTime();
setInterval(()=>{let n=Date.now(),x=t-n;
d.innerText=Math.floor(x/86400000);
h.innerText=Math.floor((x%86400000)/3600000);
m.innerText=Math.floor((x%3600000)/60000);},1000);
</script>
</body>
</html>
